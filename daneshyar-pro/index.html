<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>دانش‌یار پرو</title>
  
  <!-- فونت فارسی -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.0/index.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
              300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
              600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81'
            },
            accent: {
              300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706'
            }
          }
        }
      }
    }
  </script>
  
  <!-- استایل‌های اصلی برنامه -->
  <link rel="stylesheet" href="src/styles/main.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">
  
  <!-- Loader -->
  <div id="initial-loader">
    <div class="loader">
      <div class="loader-spinner"></div>
      <p class="loader-text">در حال بارگذاری دانش‌یار...</p>
    </div>
  </div>
  
  <!-- محل اصلی برنامه -->
  <div id="app" style="display:none;"></div>
  
  <!-- Toast Container -->
  <div id="toast-container"></div>
  
  <!-- Modal Container -->
  <div id="modal-container"></div>
  
  <!-- Main JS -->
  <script type="module" src="src/main.js"></script>
  
</body>
</html>
